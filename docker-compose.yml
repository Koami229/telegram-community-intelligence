services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tci_user
      POSTGRES_PASSWORD: tci_password
      POSTGRES_DB: tci_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tci_user -d tci_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tci_user:tci_password@postgres:5432/tci_db
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_SESSION_PATH: /app/sessions
    volumes:
      - ./sessions:/app/sessions
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python run.py"]

volumes:
  postgres_data:
  redis_data:
